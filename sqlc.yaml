version: "2"

# The repositories are generated from the SQL above and the migrations beside them, so a column rename cannot leave
# a query behind. The generated code is committed and the `drift` CI job fails when it is stale.
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: false
        # Nullable columns become pointers, so a caller cannot confuse "empty" with "absent" and a repository does
        # not have to unwrap sql.NullString at every use.
        overrides:
          - column: entries.finished_on
            go_type: { type: string, pointer: true }
          - column: entries.deleted_at
            go_type: { type: string, pointer: true }
          - column: entries.season
            go_type: { type: int64, pointer: true }
          - column: work_sources.accepted_at
            go_type: { type: string, pointer: true }
          - column: sessions.entry_id
            go_type: { type: string, pointer: true }
          - column: media.entry_id
            go_type: { type: string, pointer: true }
          - column: media.session_id
            go_type: { type: string, pointer: true }
          - column: decision_calls.session_id
            go_type: { type: string, pointer: true }
          - column: turn_calls.session_id
            go_type: { type: string, pointer: true }
