# DRAFT question bank: films and TV. For Autumn to cut, reword and add to.
#
# Same rules as books.yaml: 3 to 6 questions per entry by `weight`, skipped when the `topic` was already
# covered, at most two `short_text`, all skippable, option `value`s are stable keys, suggested answers
# are tappable hints and never pre-selected.
#
# `medium` here is a list, since one bank serves both; `applies_when.medium` narrows a question.
# topic values: sound, visuals, acting, story, pacing, ending, characters, world, writing, or null.

medium: [film, tv]

questions:
  - id: ft_story
    topic: story
    weight: 90
    prompt: "How was the story?"
    type: choice
    options:
      - { value: predictable, label: "Predictable" }
      - { value: fine, label: "Fine" }
      - { value: gripping, label: "Gripping" }
      - { value: surprising, label: "Surprising" }

  - id: ft_acting
    topic: acting
    weight: 80
    prompt: "Whose performance stood out?"
    type: short_text

  - id: ft_visuals
    topic: visuals
    weight: 85
    prompt: "How did it look?"
    type: choice
    options:
      - { value: unremarkable, label: "Unremarkable" }
      - { value: good, label: "Good" }
      - { value: striking, label: "Striking" }
      - { value: stunning, label: "Stunning" }

  - id: ft_sound
    topic: sound
    weight: 85
    prompt: "How were the sound and score?"
    type: choice
    options:
      - { value: forgettable, label: "Forgettable" }
      - { value: good, label: "Good" }
      - { value: memorable, label: "Memorable" }
      - { value: carried_it, label: "It carried the whole thing" }

  - id: ft_pacing
    topic: pacing
    weight: 80
    prompt: "How was the pacing?"
    type: choice
    options:
      - { value: dragged, label: "It dragged" }
      - { value: uneven, label: "Uneven" }
      - { value: steady, label: "Steady" }
      - { value: flew, label: "It flew by" }

  - id: ft_ending
    topic: ending
    weight: 85
    prompt: "How did the ending land?"
    type: choice
    options:
      - { value: let_down, label: "Let me down" }
      - { value: fine, label: "Fine" }
      - { value: landed, label: "It landed" }
      - { value: stayed, label: "It stuck with me" }

  - id: ft_characters
    topic: characters
    weight: 70
    prompt: "Which character stayed with you?"
    type: short_text

  - id: ft_world
    topic: world
    weight: 60
    prompt: "How was the world it built?"
    type: choice
    applies_when: { genre_hint: [scifi, fantasy] }
    options:
      - { value: forgettable, label: "Forgettable" }
      - { value: solid, label: "Solid" }
      - { value: vivid, label: "Vivid" }
      - { value: immersive, label: "I lived in it" }

  - id: ft_big_screen
    topic: null
    weight: 55
    prompt: "Was the big screen worth it?"
    type: choice
    applies_when: { format: cinema }
    options:
      - { value: no, label: "Not needed" }
      - { value: nice, label: "Nice to have" }
      - { value: essential, label: "Essential" }

  - id: tv_held_up
    topic: null
    weight: 75
    prompt: "Did it hold up across the series?"
    type: choice
    applies_when: { medium: tv }
    options:
      - { value: fell_off, label: "It fell off" }
      - { value: uneven, label: "Uneven" }
      - { value: held, label: "Held up" }
      - { value: got_better, label: "Got better" }

  - id: ft_length
    topic: null
    weight: 50
    prompt: "Was it the right length?"
    type: choice
    options:
      - { value: too_short, label: "Too short" }
      - { value: right, label: "About right" }
      - { value: too_long, label: "Too long" }

  - id: ft_recommend
    topic: null
    weight: 55
    prompt: "Would you recommend it?"
    type: choice
    options:
      - { value: no, label: "No" }
      - { value: caveats, label: "With caveats" }
      - { value: yes, label: "Yes" }
      - { value: everyone, label: "To everyone" }

  - id: ft_rewatch
    topic: null
    weight: 45
    prompt: "Would you watch it again?"
    type: choice
    options:
      - { value: no, label: "No" }
      - { value: maybe, label: "Maybe" }
      - { value: yes, label: "Yes" }
