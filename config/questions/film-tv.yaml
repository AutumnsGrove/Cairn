# Question bank: films and TV. For Autumn to cut, reword and add to.
#
# Same structure and rules as books.yaml: a "Describe it" step of multi-select chip tabs (these
# `categories` plus the shared ones), then at most three single questions by `weight`. Chips are a
# closed list, hints are dashed and never pre-selected, and values are stable keys.
#
# `medium` is a list since one bank serves both; `applies_when.medium` narrows a question or category.
# topic values: sound, visuals, acting, story, pacing, ending, characters, world, writing, or null.

medium: [film, tv]
include: [feel, content_warnings]

categories:

  - name: story
    label: Story
    topic: story
    positive: [gripping, clever, original, surprising, emotional, tight, well structured, ambitious, thoughtful, satisfying ending, perfect ending, great twists]
    negative: [predictable, cliched, confusing, convoluted, plot holes, rushed, thin, disappointing ending, forgettable, unearned]
    mixed: [ambiguous ending, predictable but satisfying, slow start strong finish, messy but interesting]

  - name: performances
    label: Performances
    topic: acting
    positive: [standout lead, great ensemble, great chemistry, memorable villain, scene-stealing support, believable, nuanced, charismatic, great child performances, great voice acting]
    negative: [wooden, over the top, miscast, uneven, forgettable, no chemistry]

  - name: visuals
    label: Visuals
    topic: visuals
    positive: [stunning, striking, beautiful cinematography, inventive framing, great production design, distinctive look, great costumes, practical effects, great visual effects, immersive]
    negative: [dark and murky, flat lighting, shaky camera, weak CGI, cheap-looking, overstyled, generic]
    neutral: [minimal, stylised, gritty, colourful, washed out]

  - name: sound
    label: Sound and music
    topic: sound
    positive: [great score, memorable soundtrack, sound design carries it, immersive mix, great use of silence, great song choices, haunting, tense music]
    negative: [loud, muddy mix, hard to hear dialogue, intrusive score, forgettable music, repetitive]

  - name: pacing
    label: Pacing
    topic: pacing
    positive: [tight, propulsive, well paced, binge-able]
    negative: [drags in the middle, rushed, too long, too short, padded, uneven, season dips]
    mixed: [slow burn, slow start strong finish, builds slowly]
    neutral: [episodic, leisurely]

questions:

  - id: ft_ending
    topic: ending
    weight: 85
    prompt: "How did the ending land?"
    type: choice
    options:
      - { value: let_down, label: "Let me down" }
      - { value: rushed, label: "It felt rushed" }
      - { value: ambiguous, label: "Left me unsure" }
      - { value: fine, label: "Fine" }
      - { value: landed, label: "It landed" }
      - { value: perfect, label: "Perfect" }
      - { value: stayed, label: "It stuck with me" }

  - id: ft_length
    topic: null
    weight: 50
    prompt: "Was it the right length?"
    type: choice
    options:
      - { value: far_too_short, label: "Far too short" }
      - { value: too_short, label: "A bit short" }
      - { value: right, label: "About right" }
      - { value: too_long, label: "A bit long" }
      - { value: far_too_long, label: "Far too long" }

  - id: ft_big_screen
    topic: null
    weight: 55
    prompt: "Was the big screen worth it?"
    type: choice
    applies_when: { format: cinema }
    options:
      - { value: no, label: "Not needed" }
      - { value: nice, label: "Nice to have" }
      - { value: essential, label: "Essential" }
      - { value: wrong_choice, label: "I would have preferred home" }

  - id: tv_held_up
    topic: null
    weight: 75
    prompt: "Did it hold up across the series?"
    type: choice
    applies_when: { medium: tv }
    options:
      - { value: fell_off, label: "It fell off" }
      - { value: uneven, label: "Uneven" }
      - { value: held, label: "Held up" }
      - { value: got_better, label: "Got better" }
      - { value: peaked_early, label: "Peaked early" }

  - id: ft_standout
    topic: acting
    weight: 55
    prompt: "Whose performance stood out?"
    type: short_text

  - id: ft_recommend
    topic: null
    weight: 70
    prompt: "Would you recommend it?"
    type: choice
    options:
      - { value: no, label: "No" }
      - { value: caveats, label: "With caveats" }
      - { value: yes, label: "Yes" }
      - { value: everyone, label: "To everyone" }
      - { value: only_some, label: "Only to the right person" }

  - id: ft_rewatch
    topic: null
    weight: 45
    prompt: "Would you watch it again?"
    type: choice
    options:
      - { value: no, label: "No" }
      - { value: maybe, label: "Maybe" }
      - { value: yes, label: "Yes" }
      - { value: already, label: "I already have" }
