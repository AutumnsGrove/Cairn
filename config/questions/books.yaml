# Question bank: books. For Autumn to cut, reword and add to.
#
# The form for a book has two parts, both skippable and neither pre-selected:
#   1. DESCRIBE IT: tabs of multi-select chips (`categories`, plus the shared ones in `include`).
#   2. A few single questions (`questions`), at most three, chosen by `weight`.
#
# Rules (enforced in code, not here):
#   - A category whose `topic` is a mentions_* flag the decisions layer says the message covered is marked
#     "you mentioned this" and gets dashed hint chips; it is never hidden and never auto-filled.
#   - A single question is SKIPPED when its `topic` was already covered, or its `applies_when` fails.
#   - At most one `short_text` question per form.
#   - Option and chip `value`s are STABLE keys stored with the answer, so answers stay comparable and
#     filterable. Labels can be reworded freely (see shared.yaml for how).
#   - `applies_when` uses the entry's own fields, so `format` is one of the domain's format names
#     (cinema, streaming, broadcast, audiobook, hardback, paperback, ebook, physical, live). Two or more
#     values mean "any of these". The decisions layer's format odds are a suggestion and are never used here.
#
# topic values: sound, visuals, acting, story, pacing, ending, characters, world, writing, or null.

medium: book
include: [feel, content_warnings]

categories:

  - name: characters
    label: Characters
    topic: characters
    positive: [believable, relatable, memorable, multilayered, likeable, original, distinct voices, vivid side characters, strong relationships, compelling villain, grow and change, diverse cast]
    negative: [flat, one-dimensional, inconsistent, feel distant, stereotyped, limited growth, forgettable, hard to care about, too many to track]
    mixed: [morally grey, hard to like but fascinating]

  - name: plot
    label: Plot
    topic: story
    positive: [gripping, clever plotting, addictive, twisty, well structured, satisfying conclusion, action-packed, epic scope, fast-paced, surprising]
    negative: [predictable, slow-paced, meandering, rushed ending, loose ends, plot holes, confusing, repetitive, cliched, drags in the middle]
    mixed: [predictable but satisfying, slow start strong finish, slow burn, ambiguous ending]
    neutral: [nonlinear, episodic, quiet and small]

  - name: setting
    label: Setting and world
    topic: world
    positive: [immersive, vivid, atmospheric, richly detailed, lived-in, original, believable rules, strong sense of place]
    negative: [generic, thin worldbuilding, under-explained, over-explained, inconsistent rules, info dumps]
    neutral: [cozy, bleak, claustrophobic, sprawling, intimate]

  - name: writing
    label: Writing style
    topic: writing
    positive: [beautiful prose, lyrical, sharp dialogue, economical, funny, distinctive voice, easy to read, immersive, clear, precise]
    negative: [clunky, overwritten, purple, stilted dialogue, too much telling, repetitive, jargon-heavy, confusing structure]
    mixed: [dense, slow to get into, demanding but rewarding]
    neutral: [simple, experimental, plain, conversational, translated]

questions:

  - id: book_ending
    topic: ending
    weight: 85
    prompt: "How did the ending land?"
    type: choice
    options:
      - { value: let_down, label: "Let me down" }
      - { value: rushed, label: "It felt rushed" }
      - { value: ambiguous, label: "Left me unsure" }
      - { value: fine, label: "Fine" }
      - { value: landed, label: "It landed" }
      - { value: perfect, label: "Perfect" }
      - { value: stayed, label: "It stuck with me" }

  - id: book_length
    topic: null
    weight: 60
    prompt: "Was it the right length?"
    type: choice
    options:
      - { value: far_too_short, label: "Far too short" }
      - { value: too_short, label: "A bit short" }
      - { value: right, label: "About right" }
      - { value: too_long, label: "A bit long" }
      - { value: far_too_long, label: "Far too long" }

  - id: book_narration
    topic: null
    weight: 70
    prompt: "How was the narration?"
    type: choice
    applies_when: { format: audiobook }
    options:
      - { value: poor, label: "Distracting" }
      - { value: flat, label: "Flat" }
      - { value: fine, label: "Fine" }
      - { value: great, label: "Great" }
      - { value: elevated, label: "Made the book better" }

  - id: book_learned
    topic: story
    weight: 75
    prompt: "Did you come away knowing something new?"
    type: choice
    applies_when: { genre_hint: nonfiction }
    options:
      - { value: no, label: "Not really" }
      - { value: some, label: "A bit" }
      - { value: lot, label: "A lot" }
      - { value: changed, label: "It changed how I think" }

  - id: book_character_stayed
    topic: characters
    weight: 55
    prompt: "Which character stayed with you?"
    type: short_text
    applies_when: { genre_hint: fiction }

  - id: book_recommend
    topic: null
    weight: 70
    prompt: "Would you recommend it?"
    type: choice
    options:
      - { value: no, label: "No" }
      - { value: caveats, label: "With caveats" }
      - { value: yes, label: "Yes" }
      - { value: everyone, label: "To everyone" }
      - { value: only_some, label: "Only to the right person" }

  - id: book_reread
    topic: null
    weight: 45
    prompt: "Would you read it again?"
    type: choice
    options:
      - { value: no, label: "No" }
      - { value: maybe, label: "Maybe" }
      - { value: yes, label: "Yes" }
      - { value: already, label: "I already have" }
