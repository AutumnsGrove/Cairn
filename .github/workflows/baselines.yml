name: baselines

# Regenerates the Playwright screenshot baselines on the platform CI runs on, and nowhere else.
#
# A pixel baseline is a claim about how the page renders on the machine that compares against it. The Linux CI
# runner is that machine, so the Linux baselines are made here, deliberately, by a person, and then reviewed
# and committed like any other change to the spec. Never run --update-snapshots locally to make a red test go
# green: that would accept whatever the developer's own machine happened to draw.
#
# Manual only. It has no secrets and touches no provider.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Why the baselines are being regenerated (goes in the run name)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  baselines:
    name: regenerate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the frontend into the embed directory
        working-directory: .
        run: make web
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Rewrite the baselines
        run: pnpm exec playwright test --update-snapshots
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines-linux
          path: web/e2e/__screenshots__/
          retention-days: 14
