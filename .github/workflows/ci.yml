name: ci

# Every check Cairn's main branch requires. Runs on a push to main and on every pull request; from S13 the
# branch ruleset requires pull requests, and until then a push reports here within the run
# (docs/CI.md 4.6). On a public repository: least privilege, actions pinned by commit, no secrets anywhere.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  GOTOOLCHAIN: local

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Check formatting
        run: |
          go run mvdan.cc/gofumpt@v0.12.0 -l $(git ls-files '*.go') | tee /tmp/fmt
          test ! -s /tmp/fmt
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.1
          args: --timeout=5m
      - name: Race tests
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Compile for the potato
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/cairn

  nocgo:
    name: nocgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Build with cgo off
        run: CGO_ENABLED=0 go build ./...
      - name: No dependency may need cgo
        env:
          CGO_ENABLED: '0'
        run: |
          if go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '^$'; then
            echo "::error::a dependency needs cgo; Cairn is pure Go"
            exit 1
          fi
          echo "nocgo: nothing of ours needs cgo"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Critical packages must stay covered
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=/tmp/cover.out ./... >/dev/null
          go tool cover -func=/tmp/cover.out | tail -1
          # The floor per package. domain is the heart: the span locator and the save guard live there, so it
          # carries the highest bar in the project (docs/slices/S03-domain-core.md).
          fail=0
          for spec in "internal/domain:95" "internal/server:80" "internal/config:80" "internal/world:80"; do
            pkg="${spec%%:*}"
            floor="${spec##*:}"
            pct=$(go tool cover -func=/tmp/cover.out | grep "cairn/$pkg/" | awk '{gsub(/%/,"",$3); s+=$3; n++} END {if (n) printf "%.0f", s/n; else print 0}')
            echo "$pkg coverage: ${pct}% (floor ${floor}%)"
            if [ "$pct" -lt "$floor" ]; then
              echo "::error::$pkg coverage is ${pct}%, below the ${floor}% floor"
              fail=1
            fi
          done
          exit "$fail"

  drift:
    name: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate everything derived from api/
        run: make gen
      - name: Fail on a diff
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::generated code is out of date. Run 'make gen' and commit the result."
            exit 1
          fi
          echo "drift: the contract and its generated code agree"

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # The app lives in web/, so the action is told where its package.json is and which pnpm to use.
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:unit
      - name: Build into a scratch directory
        run: pnpm run build
      - name: Size budget
        run: |
          set -euo pipefail
          bytes=$(du -sb build | cut -f1)
          echo "build is $bytes bytes"
          # A skeleton with one page has no business near a megabyte. Raise this deliberately, with a reason.
          if [ "$bytes" -gt 2000000 ]; then
            echo "::error::the frontend build is over 2 MB"
            exit 1
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the frontend into the embed directory
        working-directory: .
        run: make web
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run the end-to-end suite
        run: pnpm exec playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The guard script
        run: bash scripts/guard.sh all

  deps:
    name: deps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: go, javascript-typescript
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
